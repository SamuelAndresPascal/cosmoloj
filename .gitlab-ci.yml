before_script:
  - export PATH=$PATH:$MAVEN_HOME/bin:$JAVA_HOME/bin
  - java -version
  - mvn -v
  - pwd
  - echo $HOME
  - echo $MAVEN_CLI_OPTS
  - echo $ORG_SLF4J_SIMPLELOGGER_DEFAULTLOGLEVEL

after_script:
  - cat *.log

stages:
  - build
  - test
  - deploy
  - doc
  - site

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests
  artifacts:
    paths:
      - target/*
      - ./*/target/*
    expire_in: 2 days

include:
  - local: 'tex/.gitlab-ci.yml'

test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS jar:jar surefire:test
  artifacts:
    expire_in: 2 days

deploy:
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy
  environment:
    name: maven
    url: http://cosmoloj.com/maven-deploy/com/cosmoloj/cosmoloj/maven-metadata.xml
  artifacts:
    expire_in: 2 days

github:
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy -Pgithub
  artifacts:
    expire_in: 2 days

javadoc:
  stage: doc
  script:
    - mvn $MAVEN_CLI_OPTS jar:jar javadoc:aggregate-no-fork
  artifacts:
    expire_in: 2 days

site:
  stage: site
  script:
    - mvn $MAVEN_CLI_OPTS clean install
    - mvn $MAVEN_CLI_OPTS site-deploy
    - curl --silent http://cosmoloj.com/maven-site/cosmoloj/ | grep publishDate
    - curl --silent http://cosmoloj.com/maven-site/cosmoloj/apidocs/index.html | grep Generated
  artifacts:
    expire_in: 2 days
  environment:
    name: site
    url: http://cosmoloj.com/maven-site/cosmoloj/

sonar:
  stage: site
  script:
    - mvn $MAVEN_CLI_OPTS clean install
    - mvn $MAVEN_CLI_OPTS sonar:sonar -Dsonar.projectKey=$SONAR_PROJECT -Dsonar.host.url=http://$SONAR_SERVER:9000 -Dsonar.login=$SONAR_LOGIN
  artifacts:
    expire_in: 2 days
  environment:
    name: sonar
    url: http://sonar.romiosyne.net/dashboard?id=cosmoloj
